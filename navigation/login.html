<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Masuk | Arithma</title><link rel="icon" href="../asset/favicon.ico"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-page"><header><nav class="container"><a class="logo" href="../index.html"><img class="logo-mark" src="../asset/android-chrome-192x192.png" alt="">Arithma</a><a class="btn btn-outline" href="../index.html">Kembali</a></nav></header><main class="auth-shell"><section class="auth-card"><div id="loginView"><h1>Masuk ke Arithma</h1><p>Lanjutkan progres belajarmu.</p><form class="auth-form" id="loginForm"><label>Email<input id="loginEmail" type="email" required autocomplete="email" placeholder="kamu@email.com"></label><label>Password<input id="loginPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="Minimal 6 karakter"></label><p class="auth-message" id="loginMessage" role="alert"></p><button class="btn btn-gradient" type="submit">Masuk</button><button class="btn google-button" id="googleLoginButton" type="button"><span class="google-g">G</span> Masuk dengan Google</button></form><p class="auth-switch">Belum punya akun? <a href="#register" data-auth-toggle="register">Daftar sekarang</a></p></div><div id="registerView" hidden><h1>Buat akun Arithma</h1><p>Simpan progres dan latihanmu di satu tempat.</p><form class="auth-form" id="registerForm"><label>Nama lengkap<input id="regName" type="text" required autocomplete="name" placeholder="Nama lengkap"></label><label>Email<input id="regEmail" type="email" required autocomplete="email" placeholder="kamu@email.com"></label><label>Password<input id="regPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter"></label><label>Konfirmasi password<input id="regConfirmPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="Ulangi password"></label><p class="auth-message" id="registerMessage" role="alert"></p><button class="btn btn-gradient" type="submit">Daftar</button><button class="btn google-button" id="googleRegisterButton" type="button"><span class="google-g">G</span> Daftar dengan Google</button></form><p class="auth-switch">Sudah punya akun? <a href="#login" data-auth-toggle="login">Masuk</a></p></div></section></main><script type="module" src="auth.js"></script></body></html>
